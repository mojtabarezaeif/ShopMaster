{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">

Products

</h2>

<div class="row">

{% for product in products %}

<div class="col-md-3 mb-4">

<div class="card h-100">

{% if product.images.first %}

<img
src="{{ product.images.first.image.url }}"
class="card-img-top"
height="220">

{% endif %}

<div class="card-body">

<h5>

{{ product.name }}

</h5>

<p>

{{ product.brand }}

</p>

<h4>

${{ product.price }}

</h4>

<a
href="{% url 'product_detail' product.slug %}"
class="btn btn-primary">

View

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
