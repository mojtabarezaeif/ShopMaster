{% extends "base.html" %}

{% block content %}

<h2>Edit Profile</h2>

<hr>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        class="btn btn-success"
    >
        Save Changes
    </button>

    <a
        href="{% url 'dashboard' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
