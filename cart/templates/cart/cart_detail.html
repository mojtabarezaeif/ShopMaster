{% extends "base.html" %}

{% block content %}

<h2>

Shopping Cart

</h2>

<table class="table">

<tr>

<th>Product</th>

<th>Price</th>

<th>Qty</th>

<th>Total</th>

<th></th>

</tr>

{% for item in cart %}

<tr>

<td>

{{ item.product.name }}

</td>

<td>

${{ item.product.price }}

</td>

<td>

{{ item.quantity }}

</td>

<td>

${{ item.total_price }}

</td>

<td>

<a
href="{% url 'cart_remove' item.product.id %}"
class="btn btn-danger btn-sm"
>

Remove

</a>

</td>

</tr>

{% endfor %}

</table>

<hr>

<h3>

Grand Total:

${{ cart.get_total_price }}

</h3>

{% endblock %}
