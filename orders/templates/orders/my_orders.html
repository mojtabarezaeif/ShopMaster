{% extends "base.html" %}

{% block content %}

<h2>

My Orders

</h2>

{% if orders %}

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Date</th>

</tr>

{% for order in orders %}

<tr>

<td>

{{ order.id }}

</td>

<td>

{{ order.full_name }}

</td>

<td>

{{ order.email }}

</td>

<td>

{{ order.created_at }}

</td>

</tr>

{% endfor %}

</table>

{% else %}

<p>

No orders found.

</p>

{% endif %}

{% endblock %}
